<h1>Glisser-déposer</h1>
<p>Fais glisser chaque nombre vers le mot qui lui correspond (en français ou en anglais). Clique sur « Démarrer » pour lancer le chronomètre.</p>

<div class="controls">
  <label class="control-inline">Langue
    <select id="langSelect" class="input">
      <option value="fr" selected>Français</option>
      <option value="en">English</option>
    </select>
  </label>
  <label class="control-inline">Niveau
    <select id="levelSelect" class="input">
      <option value="facile">Facile — 1 à 5</option>
      <option value="moyen" selected>Moyen — 1 à 10</option>
      <option value="difficile">Difficile — 1 à 20</option>
    </select>
  </label>
  <div class="btn-group">
    <button id="restartBtn" class="btn" type="button">Démarrer</button>
    <button id="newGridBtn" class="btn btn-ghost" type="button">Nouvelle grille</button>
  </div>
</div>

<div id="numbersRow" class="numbers-row" aria-label="Nombres à déplacer"></div>
<div id="targetsRow" class="targets-row" aria-label="Emplacements de destination"></div>

<div class="footer-stats">
  <div>Erreurs : <strong id="errors">0</strong></div>
  <div>Reste : <strong id="remaining">10</strong></div>
  <div>Temps : <strong id="time">00:00</strong></div>
</div>

<div id="message" class="message" aria-live="polite"></div>

<script src="dnd-app.js"></script>
