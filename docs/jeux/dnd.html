<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Glisser‑Déposer — Nombres</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="index.html">🎓 Jeux pédagogiques</a>
      <nav aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="click.html">Clics</a>
        <a href="dnd.html" class="active" aria-current="page">Glisser-déposer</a>
        <a href="keyboard/index.html">Clavier</a>
      </nav>
    </div>
  </div>
  <header class="page-title">
    <div class="container">
      <h1>Glisser-déposer</h1>
      <p class="tag">Associe les nombres aux mots (FR / EN)</p>
    </div>
  </header>
  <div class="toolbar-panel">
    <div class="container">
      <div class="controls controls-compact">

        <label class="control-inline">Langue
          <select id="langSelect" class="input">
            <option value="fr" selected>Français</option>
            <option value="en">English</option>
          </select>
        </label>

        <label class="control-inline">Niveau
          <select id="levelSelect" class="input">
            <option value="facile">Facile — 1 à 5</option>
            <option value="moyen" selected>Moyen — 1 à 10</option>
            <option value="difficile">Difficile — 1 à 20</option>
          </select>
        </label>

        <div class="btn-group">
          <button id="restartBtn" class="btn btn-primary">Démarrer</button>
          <button id="newGridBtn" class="btn">Nouvelle grille</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container main">
    <section class="top-row">
      <div id="numbersRow" class="numbers-row" aria-label="Nombres à déplacer"></div>
    </section>

    <section class="bottom-row">
      <div id="targetsRow" class="targets-row" aria-label="Emplacements de destination"></div>
    </section>

    <div class="footer-stats">
      <div>Erreurs : <strong id="errors">0</strong></div>
      <div>Reste : <strong id="remaining">10</strong></div>
      <div>Temps : <strong id="time">00:00</strong></div>
    </div>

    <div id="message" class="message" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="small">Retour au menu : <a href="index.html">Accueil</a></div>
    </div>
  </footer>

  <script src="dnd-app.js"></script>
</body>
</html>
