<rect x="232" y="288" width="22" height="26" rx="3" fill="#fff" stroke="#8A94A6"/><text class="s" x="262" y="305">definition.txt</text>
<rect x="404" y="288" width="22" height="26" rx="3" fill="#fff" stroke="#2B579A"/><text class="s" x="434" y="305">Exposé SVT</text>
<!-- Bas du menu -->
<rect x="210" y="338" width="380" height="56" rx="0" fill="#EBEFF5"/>
<circle cx="244" cy="366" r="12" fill="#9AA7B8"/>
