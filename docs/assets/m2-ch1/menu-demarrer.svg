<rect x="210" y="26" width="380" height="368" rx="12" fill="#F6F8FB" stroke="#C9D1DC"/>
<rect x="232" y="42" width="336" height="32" rx="16" fill="#fff" stroke="#D0D7E2"/>
<circle cx="250" cy="58" r="5" fill="none" stroke="#6B7585" stroke-width="1.5"/>
