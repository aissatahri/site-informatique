<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Schéma du menu Démarrer de Windows 11 avec cinq éléments numérotés</title>
<style>
text{font-family:"Segoe UI",Arial,sans-serif}
.m{fill:#C8962E;stroke:#fff;stroke-width:2}
.n{font-size:14px;font-weight:700;fill:#1E2430;text-anchor:middle}
.a{font-size:10px;fill:#1E2430;text-anchor:middle}
.h{font-size:12px;font-weight:700;fill:#1E2430}
.s{font-size:11px;fill:#4A5568}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F4E9C"/><stop offset="1" stop-color="#6CA8E6"/></linearGradient></defs>
<rect width="800" height="450" fill="url(#bg)"/>
<!-- Barre des tâches -->
<rect y="406" width="800" height="44" fill="#F3F5F8" opacity=".96"/>
<rect x="378" y="414" width="28" height="28" rx="5" fill="#D9E4F5"/>
<rect x="386" y="421" width="6" height="6" rx="1" fill="#2B6CD4"/><rect x="394" y="421" width="6" height="6" rx="1" fill="#2B6CD4"/>
<rect x="386" y="429" width="6" height="6" rx="1" fill="#2B6CD4"/><rect x="394" y="429" width="6" height="6" rx="1" fill="#2B6CD4"/>
