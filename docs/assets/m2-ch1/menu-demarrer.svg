<rect x="246" y="120" width="36" height="36" rx="8" fill="#2B579A"/><text class="a" x="264" y="172">Word</text>
<rect x="330" y="120" width="36" height="36" rx="8" fill="#217346"/><text class="a" x="348" y="172">Excel</text>
