<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Schéma d'une fenêtre Windows 11 avec six éléments numérotés</title>
<style>
text{font-family:"Segoe UI",Arial,sans-serif}
.m{fill:#C8962E;stroke:#fff;stroke-width:2}
.n{font-size:14px;font-weight:700;fill:#1E2430;text-anchor:middle}
.s{font-size:12px;fill:#1E2430}
.g{font-size:11px;fill:#6B7585}
</style>
<rect width="800" height="450" fill="#DCE6F2"/>
<rect x="70" y="40" width="660" height="370" rx="8" fill="#fff" stroke="#9AA7B8" stroke-width="1.5"/>
