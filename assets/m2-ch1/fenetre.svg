<text class="s" x="108" y="63">Sans titre – Bloc-notes</text>
<text x="620" y="66" font-size="18" fill="#1E2430" text-anchor="middle">–</text>
<rect x="663" y="52" width="12" height="12" fill="none" stroke="#1E2430" stroke-width="1.5"/>
<path d="M702 52l12 12M714 52l-12 12" stroke="#1E2430" stroke-width="1.5"/>
